name: Moodprint

options:
  bundleIdPrefix: com.moodprint
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Moodprint:
    type: application
    platform: iOS
    sources:
      - path: Moodprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodprint.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      gatherCoverageData: true
      testTargets:
        - MoodprintTests
        - MoodprintUITests

  MoodprintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoodprintTests
        optional: true
    dependencies:
      - target: Moodprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodprint.app.tests
        GENERATE_INFOPLIST_FILE: YES

  MoodprintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoodprintUITests
        optional: true
    dependencies:
      - target: Moodprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodprint.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Moodprint
