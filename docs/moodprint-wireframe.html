:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,

a:is(:hover, :focus-visible) {

h2,
h3,
h4,
h5,
h6,

}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

}

.table-responsive {
  width: 100%;
  overflow-x: auto;

}

  width: 100%;

  font: inherit;

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

}

}

.table .text-nowrap {

}

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  gap: 2px 12px;
  margin-bottom: 0;

.btn,

.btn {

  min-height: 28px;
  align-items: center;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);

}

  opacity: 0.4;

[data-lucide] {

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  padding: 8px 10px;

.form-control:focus-visible {
  border-color: var(--ring);

.form-control:disabled,

  color: var(--foreground);
  background-color: var(--secondary);

.form-check-input {

  border: 1px solid var(--input);
  color: var(--primary-foreground);

  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;moodprint-wireframe&quot;&gt;
  &lt;style&gt;
    #moodprint-wireframe {
      --mp-ink: light-dark(#2f2a3f, #f5f1ff);
      --mp-muted: light-dark(#756f80, #bdb5cb);
      --mp-bg: light-dark(#f4effb, #1c1826);
      --mp-surface: light-dark(#fffdfd, #2a2435);
      --mp-soft: light-dark(#eee7f8, #3b314b);
      --mp-primary: light-dark(#7867a6, #aa94d8);
      --mp-primary-ink: light-dark(#ffffff, #211a2d);
      --mp-mint: light-dark(#d8eee7, #27443d);
      --mp-coral: light-dark(#f7ded8, #543831);
      --mp-yellow: light-dark(#f8edc8, #51472a);
      --mp-line: light-dark(#ded6e8, #4a4058);
      color: var(--mp-ink);
      font-family: ui-rounded, &quot;Pretendard&quot;, &quot;Apple SD Gothic Neo&quot;, system-ui, sans-serif;
      display: grid;
      justify-items: center;
      gap: 12px;
      width: 100%;
    }

    #moodprint-wireframe * { box-sizing: border-box; }

    #moodprint-wireframe .mp-stagebar {
      width: min(390px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--mp-muted);
      font-size: 12px;
    }

    #moodprint-wireframe .mp-stagebar button,
    #moodprint-wireframe button {
      font: inherit;
      cursor: pointer;
    }

    #moodprint-wireframe .mp-stagebar button {
      border: 1px solid var(--mp-line);
      background: var(--mp-surface);
      color: var(--mp-ink);
      border-radius: 999px;
      padding: 7px 12px;
    }

    #moodprint-wireframe .mp-stagebar button:disabled {
      opacity: .35;
      cursor: default;
    }

    #moodprint-wireframe .mp-phone {
      position: relative;
      width: min(390px, 100%);
      min-height: 720px;
      overflow: hidden;
      border: 1px solid var(--mp-line);
      border-radius: 30px;
      background: var(--mp-bg);
      box-shadow: 0 18px 50px light-dark(rgba(49, 36, 68, .14), rgba(0, 0, 0, .3));
    }

    #moodprint-wireframe .mp-status {
      height: 30px;
      padding: 10px 18px 0;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--mp-muted);
    }

    #moodprint-wireframe .mp-screen {
      min-height: 690px;
      padding: 22px 22px 86px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    #moodprint-wireframe .mp-screen.is-active { display: flex; }
    #moodprint-wireframe .mp-center { align-items: center; text-align: center; justify-content: center; }
    #moodprint-wireframe .mp-spacer { flex: 1; }

    #moodprint-wireframe h2,
    #moodprint-wireframe h3,
    #moodprint-wireframe p { margin: 0; }
    #moodprint-wireframe h2 { font-size: 25px; line-height: 1.25; font-weight: 500; }
    #moodprint-wireframe h3 { font-size: 17px; line-height: 1.35; font-weight: 500; }
    #moodprint-wireframe p { font-size: 14px; line-height: 1.55; }
    #moodprint-wireframe .mp-muted { color: var(--mp-muted); }
    #moodprint-wireframe .mp-small { font-size: 12px; }
    #moodprint-wireframe .mp-eyebrow { color: var(--mp-primary); font-size: 12px; letter-spacing: .08em; }

    #moodprint-wireframe .mp-primary,
    #moodprint-wireframe .mp-secondary,
    #moodprint-wireframe .mp-chip,
    #moodprint-wireframe .mp-option {
      border-radius: 16px;
      border: 1px solid transparent;
      min-height: 46px;
      padding: 11px 16px;
    }

    #moodprint-wireframe .mp-primary {
      width: 100%;
      border-color: var(--mp-primary);
      background: var(--mp-primary);
      color: var(--mp-primary-ink);
    }

    #moodprint-wireframe .mp-secondary {
      width: 100%;
      background: transparent;
      border-color: var(--mp-line);
      color: var(--mp-ink);
    }

    #moodprint-wireframe .mp-card {
      background: var(--mp-surface);
      border: 1px solid var(--mp-line);
      border-radius: 20px;
      padding: 17px;
    }

    #moodprint-wireframe .mp-card.soft { background: var(--mp-soft); }
    #moodprint-wireframe .mp-card.mint { background: var(--mp-mint); }
    #moodprint-wireframe .mp-card.coral { background: var(--mp-coral); }

    #moodprint-wireframe .mp-pet {
      position: relative;
      width: 116px;
      height: 100px;
      margin: 6px auto 12px;
      border-radius: 52% 48% 45% 47%;
      background: light-dark(#cbbce8, #7e67aa);
      box-shadow: inset 0 -10px 0 rgba(80, 54, 110, .08);
    }

    #moodprint-wireframe .mp-pet::before,
    #moodprint-wireframe .mp-pet::after {
      content: &quot;&quot;;
      position: absolute;
      top: 15px;
      width: 25px;
      height: 28px;
      background: inherit;
      border-radius: 70% 30% 60% 40%;
      z-index: -1;
    }

    #moodprint-wireframe .mp-pet::before { left: -5px; transform: rotate(-28deg); }
    #moodprint-wireframe .mp-pet::after { right: -5px; transform: scaleX(-1) rotate(-28deg); }
    #moodprint-wireframe .mp-face { position: absolute; inset: 0; }
    #moodprint-wireframe .mp-eye {
      position: absolute;
      top: 43px;
      width: 7px;
      height: 9px;
      border-radius: 50%;
      background: #352c41;
    }
    #moodprint-wireframe .mp-eye.left { left: 36px; }
    #moodprint-wireframe .mp-eye.right { right: 36px; }
    #moodprint-wireframe .mp-mouth {
      position: absolute;
      top: 59px;
      left: 51px;
      width: 14px;
      height: 8px;
      border-bottom: 2px solid #352c41;
      border-radius: 50%;
    }
    #moodprint-wireframe .mp-blush {
      position: absolute;
      top: 56px;
      width: 14px;
      height: 7px;
      border-radius: 50%;
      background: rgba(244, 134, 150, .25);
    }
    #moodprint-wireframe .mp-blush.left { left: 18px; }
    #moodprint-wireframe .mp-blush.right { right: 18px; }
    #moodprint-wireframe .mp-spark {
      position: absolute;
      color: light-dark(#e8b655, #f4d57a);
      font-size: 18px;
      animation: mp-float 2.4s ease-in-out infinite;
    }
    #moodprint-wireframe .mp-spark.one { top: -8px; right: 2px; }
    #moodprint-wireframe .mp-spark.two { bottom: 5px; left: -8px; animation-delay: .6s; }

    @keyframes mp-float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    #moodprint-wireframe .mp-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #moodprint-wireframe .mp-level {
      height: 8px;
      border-radius: 999px;
      background: light-dark(#e6dfed, #44394f);
      overflow: hidden;
      margin-top: 8px;
    }
    #moodprint-wireframe .mp-level &gt; span {
      display: block;
      width: 62%;
      height: 100%;
      border-radius: inherit;
      background: var(--mp-primary);
    }

    #moodprint-wireframe .mp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    #moodprint-wireframe .mp-chip,
    #moodprint-wireframe .mp-option {
      background: var(--mp-surface);

      border-color: var(--mp-line);

      color: var(--mp-primary-ink);

    #moodprint-wireframe .mp-field { display: grid; gap: 8px; }

      min-height: 98px;

      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;

      width: 100%;
      background: var(--mp-surface);
      color: var(--mp-ink);
      border-radius: 24px;
      padding: 20px;
      display: grid;
      gap: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);

    #moodprint-wireframe .mp-modal-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #moodprint-wireframe .mp-reward {
      display: grid;
      place-items: center;
      text-align: center;
      gap: 12px;
    }

    #moodprint-wireframe .mp-xp {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--mp-yellow);
      color: var(--mp-ink);
      font-size: 13px;

      grid-template-columns: repeat(3, 1fr);
      gap: 10px;

      min-height: 118px;
      border: 1px solid var(--mp-line);
      border-radius: 18px;
      background: var(--mp-surface);
      padding: 10px 6px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 7px;
      font-size: 12px;
    }

    #moodprint-wireframe .mp-mini-pet {
      position: relative;
      width: 54px;
      height: 48px;
      border-radius: 52% 48% 45% 47%;
      background: var(--pet-color, #cbbce8);

    #moodprint-wireframe .mp-mini-pet::before,
    #moodprint-wireframe .mp-mini-pet::after {
      content: &quot;&quot;;
      position: absolute;
      top: 21px;
      width: 5px;
      height: 6px;

    #moodprint-wireframe .mp-mini-pet::after { right: 16px; }
    #moodprint-wireframe .mp-mini-pet.mint { --pet-color: #a9d8ca; }
    #moodprint-wireframe .mp-mini-pet.coral { --pet-color: #efb7ad; }

    #moodprint-wireframe .mp-mini-pet.locked {

      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 61px;
      border: 1px solid var(--mp-line);
      border-radius: 20px;
      background: var(--mp-surface);
      display: none;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 10;

    #moodprint-wireframe .mp-nav.is-visible { display: grid; }
    #moodprint-wireframe .mp-nav button {
      border: 0;
      background: transparent;
      color: var(--mp-muted);
      display: grid;
      gap: 3px;
      justify-items: center;

    }
    #moodprint-wireframe .mp-nav button.is-active { color: var(--mp-primary); }

    @media (max-width: 420px) {
      #moodprint-wireframe .mp-phone { border-radius: 24px; min-height: 690px; }
      #moodprint-wireframe .mp-screen { min-height: 660px; padding-inline: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #moodprint-wireframe .mp-spark { animation: none; }
    }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;moodprint-wireframe&#x27;);
      const order = [&#x27;start&#x27;,&#x27;intro&#x27;,&#x27;home&#x27;,&#x27;checkin&#x27;,&#x27;recommend&#x27;,&#x27;action&#x27;,&#x27;action&#x27;,&#x27;reward&#x27;,&#x27;collection&#x27;];
      const labels = [&#x27;시작&#x27;,&#x27;캐릭터 소개&#x27;,&#x27;홈&#x27;,&#x27;감정 기록&#x27;,&#x27;행동 추천&#x27;,&#x27;행동 실행&#x27;,&#x27;변화 팝업&#x27;,&#x27;펫 성장&#x27;,&#x27;도감&#x27;];
      const screens = [...root.querySelectorAll(&#x27;.mp-screen&#x27;)];
      const prev = root.querySelector(&#x27;#mp-prev&#x27;);
      const next = root.querySelector(&#x27;#mp-next&#x27;);
      const stepLabel = root.querySelector(&#x27;#mp-step-label&#x27;);
      const modal = root.querySelector(&#x27;#mp-change-modal&#x27;);
      const nav = root.querySelector(&#x27;#mp-nav&#x27;);
      const timerEl = root.querySelector(&#x27;#mp-timer&#x27;);
      let step = 0;
      let timerValue = 180;
      let timerId = null;

      function updateTimer() {
        const minutes = Math.floor(timerValue / 60);
        const seconds = timerValue % 60;
        timerEl.textContent = `${String(minutes).padStart(2,&#x27;0&#x27;)}:${String(seconds).padStart(2,&#x27;0&#x27;)}`;
      }

      function setStep(index) {
        step = Math.max(0, Math.min(order.length - 1, index));
        screens.forEach(screen =&gt; screen.classList.toggle(&#x27;is-active&#x27;, screen.dataset.screen === order[step]));
        modal.classList.toggle(&#x27;is-open&#x27;, step === 6);
        nav.classList.toggle(&#x27;is-visible&#x27;, [&#x27;home&#x27;,&#x27;collection&#x27;].includes(order[step]));
        prev.disabled = step === 0;
        next.disabled = step === order.length - 1;
        stepLabel.textContent = `${step + 1} / ${order.length} · ${labels[step]}`;
        if (order[step] !== &#x27;action&#x27;) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function goTo(name) {
        const index = order.indexOf(name);
        if (index &gt;= 0) setStep(index);
      }

      root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; goTo(button.dataset.go));
      });

      prev.addEventListener(&#x27;click&#x27;, () =&gt; setStep(step - 1));
      next.addEventListener(&#x27;click&#x27;, () =&gt; setStep(step + 1));

      root.querySelectorAll(&#x27;#mp-emotions .mp-chip&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const pressed = button.getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27;;
          const count = root.querySelectorAll(&#x27;#mp-emotions .mp-chip[aria-pressed=&quot;true&quot;]&#x27;).length;
          if (!pressed &amp;&amp; count &gt;= 2) return;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(!pressed));
        });
      });

      root.querySelectorAll(&#x27;.mp-row .mp-option&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          button.parentElement.querySelectorAll(&#x27;.mp-option&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
        });
      });

      root.querySelector(&#x27;#mp-timer-toggle&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
          event.currentTarget.textContent = &#x27;계속하기&#x27;;
        } else {
          event.currentTarget.textContent = &#x27;일시정지&#x27;;
          timerId = setInterval(() =&gt; {
            if (timerValue &gt; 0) {
              timerValue -= 1;
              updateTimer();
            } else {
              clearInterval(timerId);
              timerId = null;
              modal.classList.add(&#x27;is-open&#x27;);
            }
          }, 1000);
        }
      });

      root.querySelector(&#x27;#mp-complete&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        clearInterval(timerId);
        timerId = null;
        modal.classList.add(&#x27;is-open&#x27;);
      });

      root.querySelectorAll(&#x27;#mp-change-options .mp-option&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;#mp-change-options .mp-option&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;);
        });
      });

      root.querySelector(&#x27;#mp-save-change&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; setStep(7));
      updateTimer();
      setStep(0);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
